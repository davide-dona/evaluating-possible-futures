defaults:
- tables_schema
- override hydra/job_logging: disabled
- override hydra/hydra_logging: disabled
- _self_
hydra:
  run:
    dir: outputs/tables
  job:
    chdir: false
# The name the tables print for every dataset.
datasets:
  sepsis: Sepsis
  bpic12: BPIC12
  bpic17: BPIC17
  bpic19: BPIC19
  synthetic: Synthetic
# The datasets and the decodings of every table of scores. Its rows are grouped by dataset and
# follow the order of the decodings within each.
scores:
  real:
    datasets: [sepsis, bpic12, bpic17, bpic19]
    decodings: [sampled, medoid, unconditional]
  synthetic:
    datasets: [synthetic]
    decodings: [oracle_sampled, oracle_greedy, markov_sampled, markov_greedy]
# The rows of the table of the properties of the preprocessed logs, in this order.
properties: [sepsis, bpic12, bpic17, bpic19, synthetic]
# The LaTeX macro that prints every decoding.
decodings:
  sampled: \Sampled
  medoid: \Medoid
  unconditional: \Unconditional
  oracle_sampled: \OracleSampled
  oracle_greedy: \OracleGreedy
  markov_sampled: \MarkovSampled
  markov_greedy: \MarkovGreedy
# The columns of every table of scores, keyed by their name in the scores files and in the order
# printed, each with its LaTeX header and whether a higher mean is better.
metrics:
  DLS:
    header: $\meanDLS$~$\uparrow$
    higher_is_better: true
  ES dl:
    header: \DL~$\downarrow$
    higher_is_better: false
  ES exact:
    header: \exact~$\downarrow$
    higher_is_better: false
  ES bigram:
    header: \ngram[2]~$\downarrow$
    higher_is_better: false
