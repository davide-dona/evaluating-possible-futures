defaults:
- train_schema
- output/default
- dataset: ???
- model: u_ed_lstm
- _self_
# The hyperparameters of a dataset that needs its own, overriding the ones below. A multirun first
# composes without its sweep values, leaving `dataset` missing. Falling back to ??? makes Hydra
# skip the hyperparameters there too, instead of failing on the missing interpolation.
- optional hyperparameters: ${oc.select:dataset,???}
seed: 42
device: cuda:0
optimizer:
  _target_: torch.optim.AdamW
  _partial_: true
  lr: 4.0e-6
  # The weights are penalized in the loss, by `training.weight_penalty`, not decayed here.
  weight_decay: 0.0
training:
  epochs: 100
  batch_size: 1024
  # Events following every prefix that label it, EOS past the end of the case.
  target_length: 5
  weight_penalty: 1.0e-4
  grad_clip_norm: 1.0
  teacher_forcing:
    start: 1.0
    end: 0.0
    fraction: 0.5
