# @package _global_
data:
  name: synthetic
  case_key: case:concept:name
  activity_key: concept:name
  timestamp_key: time:timestamp
  separator: ','
  test_split: 0.2
  # Every case holds 5 events and lasts 4 hours, so no case is an outlier.
  max_case_length_percentile: 100
  # Also the length of the debiased window at the end of the log.
  max_case_duration_percentile: 100
  num_cases: 20000
  simulation_seed: 42
  process:
    p_b: 0.7
    q_b: 0.9
    q_c: 0.3
