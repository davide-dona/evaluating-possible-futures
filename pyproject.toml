[project]
name = "improper-suffix-metrics"
version = "0.1.0"
description = "Empirical evidence that averaged point metrics reward mode collapse in suffix prediction"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "rapidfuzz>=3.14.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "nbconvert>=7.16.0",
    "ruff>=0.16.1",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "N",   # pep8-naming
]

[tool.ruff.format]
quote-style = "single"
