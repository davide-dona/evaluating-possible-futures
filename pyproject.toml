[project]
name = "improper-suffix-metrics"
version = "0.1.0"
description = "Empirical evidence that averaged point metrics reward mode collapse in suffix prediction"
requires-python = ">=3.13"
dependencies = [
    "hydra-core>=1.3.6",
    "numpy>=2.5.1",
    "omegaconf>=2.3.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "rapidfuzz>=3.14.0",
    "torch>=2.13.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "N",   # pep8-naming
]
ignore = [
    "N812",  # `torch.nn.functional as F` is the standard PyTorch idiom
]

[tool.ruff.lint.isort]
known-first-party = ["src", "pipelines"]

[tool.ruff.format]
quote-style = "single"
